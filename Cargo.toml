[workspace]
resolver = "2"
members = [
    "crates/vdesk-protocol",
    "crates/vdesk-host",
    "crates/vdesk-quest",
]
default-members = [
    "crates/vdesk-protocol",
    "crates/vdesk-host",
    "crates/vdesk-quest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drakkhis/VirtualRustTop"
readme = "README.md"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = "symbols"
